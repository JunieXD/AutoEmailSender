[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "3.0.0-alpha.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
account = { path = "crates/account" }
cloud-api = { path = "crates/cloud-api" }
api = { path = "crates/api" }
crawl = { path = "crates/crawl" }
check = { path = "crates/check" }
db = { path = "crates/db" }
email = { path = "crates/email" }
fakemail = { path = "crates/fakemail" }
mailbox = { path = "crates/mailbox" }
material = { path = "crates/material" }
matching = { path = "crates/matching" }
mentor = { path = "crates/mentor" }
library = { path = "crates/library" }
sheet = { path = "crates/sheet" }
model = { path = "crates/model" }
profile = { path = "crates/profile" }
receive = { path = "crates/receive" }
send = { path = "crates/send" }
stats = { path = "crates/stats" }
task = { path = "crates/task" }
template = { path = "crates/template" }
writing = { path = "crates/writing" }
net = { path = "crates/net" }
ocr = { path = "crates/ocr" }
remote = { path = "crates/remote" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
libsqlite3-sys = { version = "0.37.0", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate", "json"] }
tokio = "1.54.1"
tracing = "0.1.44"
ts-rs = "12.0.1"

calamine = "0.37.0"
csv = "1.4.0"
encoding_rs = "0.8.42"
rust_xlsxwriter = "0.101.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Line numbers are enough for panics and failing tests. Full debug info stays in the object files
# on macOS and made every worktree's target tens of gigabytes. Dependency frames in backtraces keep
# their function names; their line tables would add another 1.5 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# SQLite is C code that is slow unoptimised; the development app and `cargo xtask bench` both use it.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# Memory filling must stay fast enough for interactive password derivation in development.
[profile.dev.package.argon2]
opt-level = 3

# Text recognition runs a neural network, seconds an image unoptimised; its tests and the
# development app read images with it.
[profile.dev.package.ocr]
opt-level = 3

[profile.dev.package.rten]
opt-level = 3

[profile.dev.package.rten-base]
opt-level = 3

[profile.dev.package.rten-gemm]
opt-level = 3

[profile.dev.package.rten-simd]
opt-level = 3

[profile.dev.package.rten-tensor]
opt-level = 3

[profile.dev.package.rten-vecmath]
opt-level = 3
