appId: com.juniexd.autoemailsender
productName: Auto Email Sender
asar: true
directories:
  output: release
files:
  - dist/**
  - package.json
afterPack: build/configure-sparkle-info.mjs
afterSign: build/sanitize-macos-bundle.mjs
extraResources:
  - from: ../frontend/dist
    to: frontend
  - from: ../backend/dist/backend
    to: backend
  - from: ../backend/ms-playwright
    to: ms-playwright
  - from: ../cli/dist/auto-email-sender
    to: cli
  - from: ../agent-support
    to: agent-support
  - from: build/icon.ico
    to: build/icon.ico
  - from: build/icon.png
    to: build/icon.png
  - from: build/runtime/vc_redist.x64.exe
    to: runtime/vc_redist.x64.exe
win:
  artifactName: "AutoEmailSender-Setup-${version}.${ext}"
  icon: build/icon.ico
  electronLanguages:
    - en-US
    - en-GB
    - zh-CN
    - zh-TW
  target:
    - target: nsis
      arch:
        - x64
mac:
  artifactName: "AutoEmailSender-${version}-${arch}.${ext}"
  icon: build/icon.icns
  electronLanguages:
    - en
    - en_GB
    - zh_CN
    - zh_TW
  category: public.app-category.productivity
  identity: "-"
  extendInfo:
    SUFeedURL: "https://github.com/JunieXD/AutoEmailSender/releases/latest/download/appcast.xml"
    SUEnableAutomaticChecks: true
    SUAllowsAutomaticUpdates: false
    SUScheduledCheckInterval: 86400
    SUVerifyUpdateBeforeExtraction: true
    SURequireSignedFeed: true
  extraResources:
    - from: native/sparkle/build/Release/sparkle_bridge.node
      to: native/sparkle_bridge.node
    - from: native/sparkle/vendor/LICENSE
      to: licenses/Sparkle-LICENSE
  extraFiles:
    - from: native/sparkle/vendor/Sparkle.framework
      to: Frameworks/Sparkle.framework
  target:
    - target: dmg
      arch:
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: Auto Email Sender
publish:
  provider: github
  owner: JunieXD
  repo: AutoEmailSender
  releaseType: release
releaseInfo:
  releaseNotesFile: release-notes.md
