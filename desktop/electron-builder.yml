appId: com.juniexd.autoemailsender
productName: Auto Email Sender
asar: true
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: ../frontend/dist
    to: frontend
  - from: ../backend/dist/backend
    to: backend
  - from: ../backend/ms-playwright
    to: ms-playwright
  - from: build/icon.ico
    to: build/icon.ico
  - from: build/icon.png
    to: build/icon.png
win:
  artifactName: "AutoEmailSender Setup ${version}.${ext}"
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
mac:
  artifactName: "AutoEmailSender-${version}-${arch}.${ext}"
  icon: build/icon.icns
  category: public.app-category.productivity
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: Auto Email Sender
publish:
  provider: github
  owner: JunieXD
  repo: AutoEmailSender
  releaseType: release
releaseInfo:
  releaseNotesFile: release-notes.md
