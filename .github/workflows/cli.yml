name: Agent CLI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "cli/**"
      - "agent-support/skills/auto-email-sender/**"
      - "scripts/build-cli.ps1"
      - "scripts/build-cli.sh"
      - "scripts/build/build-cli.ps1"
      - "scripts/build/build-cli.sh"
      - "scripts/build/generate_cli_build_identity.py"
      - "scripts/build/verify_cli_binary.py"
      - "scripts/quality/cli-workflow.test.mjs"
      - ".github/workflows/cli.yml"
      - ".github/workflows/cli-binaries.yml"
  pull_request:
    paths:
      - "cli/**"
      - "agent-support/skills/auto-email-sender/**"
      - "scripts/build-cli.ps1"
      - "scripts/build-cli.sh"
      - "scripts/build/build-cli.ps1"
      - "scripts/build/build-cli.sh"
      - "scripts/build/generate_cli_build_identity.py"
      - "scripts/build/verify_cli_binary.py"
      - "scripts/quality/cli-workflow.test.mjs"
      - ".github/workflows/cli.yml"
      - ".github/workflows/cli-binaries.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-contract-tests:
    name: CLI contract tests (ubuntu-latest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify CLI workflow topology
        working-directory: .
        run: node scripts/quality/cli-workflow.test.mjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install CLI dependencies
        run: uv sync --dev

      - name: Run CLI contract tests
        run: uv run python -m unittest discover test

  cross-platform-contract-tests:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: CLI contract tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install CLI dependencies
        run: uv sync --dev

      - name: Run CLI contract tests
        run: uv run python -m unittest discover test
