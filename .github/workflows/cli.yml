name: Agent CLI

on:
  push:
    paths:
      - "cli/**"
      - "agent-support/skills/auto-email-sender/**"
      - "scripts/build-cli.ps1"
      - "scripts/build-cli.sh"
      - "scripts/generate_cli_build_identity.py"
      - "scripts/verify_cli_binary.py"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "cli/**"
      - "agent-support/skills/auto-email-sender/**"
      - "scripts/build-cli.ps1"
      - "scripts/build-cli.sh"
      - "scripts/generate_cli_build_identity.py"
      - "scripts/verify_cli_binary.py"
      - ".github/workflows/cli.yml"

permissions:
  contents: read

jobs:
  contract-tests:
    name: CLI contract tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install CLI dependencies
        run: uv sync --dev

      - name: Run CLI contract tests
        run: uv run python -m unittest discover test

      - name: Build and verify frozen CLI (POSIX)
        if: runner.os != 'Windows'
        working-directory: .
        run: ./scripts/build-cli.sh --clean

      - name: Build and verify frozen CLI (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: ./scripts/build-cli.ps1 -Clean
