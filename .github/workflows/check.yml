name: 检查

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Each test creates its own SQLite database in a temporary directory; on the Windows
      # runner's system drive that made the tests take ten times as long as on macOS.
      - if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v4
        with:
          env-mapping: |
            TMP,{{ DEV_DRIVE }}/
            TEMP,{{ DEV_DRIVE }}/
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features sqlite,sqlx-toml --locked
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
