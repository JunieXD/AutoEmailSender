name: Validate Backend Migrations

on:
  pull_request:
    paths:
      - "backend/alembic/**"
      - "backend/app/core/migrations.py"
      - "backend/app/core/schema_backup.py"
      - "backend/app/core/schema_metadata.py"
      - "backend/test/test_community_mentor_data.py"
      - "backend/test/test_database_schema.py"
      - "backend/test/test_migrations_runtime.py"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/backend-migrations.yml"
  push:
    branches:
      - master
    paths:
      - "backend/alembic/**"
      - "backend/app/core/migrations.py"
      - "backend/app/core/schema_backup.py"
      - "backend/app/core/schema_metadata.py"
      - "backend/test/test_community_mentor_data.py"
      - "backend/test/test_database_schema.py"
      - "backend/test/test_migrations_runtime.py"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/backend-migrations.yml"

permissions:
  contents: read

concurrency:
  group: backend-migrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --dev --frozen

      - name: Validate migration graph and recovery paths
        working-directory: backend
        run: >-
          uv run python -m unittest
          test.test_database_schema.MigrationScriptTests.test_alembic_revision_ids_are_unique
          test.test_database_schema.MigrationScriptTests.test_alembic_graph_has_exactly_one_head
          test.test_community_mentor_data.CommunityMigrationTests
          test.test_migrations_runtime
