name: Release Desktop
run-name: >-
  ${{ github.event_name == 'push' && format('Release {0}', github.ref_name) ||
      inputs.candidate_run_id != '' && format('Promote {0} from candidate {1}', inputs.release_tag, inputs.candidate_run_id) ||
      format('Certify {0} at {1}', inputs.release_tag, inputs.release_sha) }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to validate or publish (for example, v2.5.5)
        required: true
        type: string
      release_sha:
        description: Exact commit SHA whose artifacts must be built
        required: true
        type: string
      publish:
        description: Promote artifacts from candidate_run_id to a public Release
        required: true
        default: false
        type: boolean
      candidate_run_id:
        description: Successful certification run whose exact artifacts should be promoted
        required: false
        default: ""
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}

permissions:
  actions: read
  contents: write

jobs:
  preflight:
    if: github.event_name == 'push' || inputs.candidate_run_id == ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock

      - name: Validate frozen release candidate
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            node scripts/release/check-release-version.mjs --version "${RELEASE_TAG#v}" --repo-root .
          fi
          node scripts/release/release-preflight.mjs \
            --version "${RELEASE_TAG#v}" \
            --release-sha "$RELEASE_SHA" \
            --repo-root .

      - name: Test release orchestration contracts
        run: >-
          node --test
          scripts/release/check-release-version.test.mjs
          scripts/release/quality-evidence.test.mjs
          scripts/release/release-candidate.test.mjs
          scripts/release/release-impact.test.mjs
          scripts/release/release-preflight.test.mjs
          scripts/release/prepare-sparkle-release.test.mjs
          scripts/release/verify-release.test.mjs
          scripts/release/verify-sparkle-draft-assets.test.mjs
          scripts/packaging/configure-sparkle-info.test.mjs
          scripts/packaging/sanitize-macos-bundle.test.mjs
          scripts/quality/cli-workflow.test.mjs
          scripts/quality/script-topology.test.mjs
          scripts/quality/document-topology.test.mjs

      - name: Test Windows VM host readiness helper
        run: bash scripts/quality/windows-vm-host-utils.test.sh

      - name: Test POSIX and PowerShell release entrypoints
        shell: bash
        run: |
          bash scripts/release/prepare-release.test.sh
          bash scripts/release/release-script.test.sh
          pwsh -NoProfile -File scripts/release/prepare-release.test.ps1
          pwsh -NoProfile -File scripts/release/release-script.test.ps1

      - name: Test backend release contracts
        working-directory: backend
        run: |
          uv sync --dev
          uv run --no-sync python -m unittest \
            test.test_backend_build_script \
            test.test_crawl_mentors_skill_contract \
            test.test_crawl_mentors_skill_package

  cli-gate:
    if: github.event_name == 'push' || inputs.candidate_run_id == ''
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: cli/uv.lock

      - name: Test Agent CLI
        working-directory: cli
        run: |
          uv sync --dev
          uv run --no-sync python -m unittest discover test

  build-windows:
    if: github.event_name == 'push' || inputs.candidate_run_id == ''
    runs-on: windows-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            cli/uv.lock
            backend/uv.lock

      - name: Check time usage
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/quality/check-time-usage.ps1

      - name: Test Windows Agent support cleanup
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/quality/windows-agent-support-cleanup.test.ps1

      - name: Prepare Windows packaging prerequisites
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/build/prepare-windows-vc-runtime.ps1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Agent CLI dependencies
        working-directory: cli
        run: uv sync --dev

      - name: Build Agent CLI
        run: ./scripts/build/build-cli.ps1 -Clean -SkipSync
        shell: pwsh

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --dev

      - name: Build backend executable
        run: ./scripts/build/build-backend.ps1 -Clean -SkipSync
        shell: pwsh

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows release
        working-directory: desktop
        run: npm run dist:prepared

      - name: Record Windows candidate evidence
        shell: pwsh
        run: >-
          node scripts/release/release-candidate.mjs platform
          --platform windows
          --release-tag "$env:RELEASE_TAG"
          --release-sha "$env:RELEASE_SHA"
          --run-id "$env:GITHUB_RUN_ID"
          --artifact-dir desktop/release
          --output release-evidence/windows.json

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            desktop/release/AutoEmailSender-Setup-*.exe
            desktop/release/AutoEmailSender-Setup-*.exe.blockmap
            desktop/release/latest.yml

      - name: Upload Windows candidate evidence
        uses: actions/upload-artifact@v7
        with:
          name: windows-evidence
          if-no-files-found: error
          path: release-evidence/windows.json

  build-macos:
    if: github.event_name == 'push' || inputs.candidate_run_id == ''
    runs-on: macos-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            cli/uv.lock
            backend/uv.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Agent CLI dependencies
        working-directory: cli
        run: uv sync --dev

      - name: Build Agent CLI
        run: ./scripts/build/build-cli.sh --clean

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --dev

      - name: Build backend executable
        run: ./scripts/build/build-backend.sh --clean

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Test desktop
        working-directory: desktop
        run: npm test

      - name: Build macOS DMG
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: npm run dist:mac

      - name: Restore verified historical Sparkle DMGs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/auto-email-sender-sparkle-dmgs
          key: sparkle-dmgs-v1-${{ runner.os }}-${{ env.RELEASE_TAG }}
          restore-keys: |
            sparkle-dmgs-v1-${{ runner.os }}-

      - name: Generate signed appcast and deltas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: >-
          node scripts/release/prepare-sparkle-release.mjs
          --release-tag "$RELEASE_TAG"
          --previous-dmg-cache "$RUNNER_TEMP/auto-email-sender-sparkle-dmgs"
          --output-dir desktop/release/sparkle-publish

      - name: Record macOS candidate evidence
        run: >-
          node scripts/release/release-candidate.mjs platform
          --platform macos
          --release-tag "$RELEASE_TAG"
          --release-sha "$RELEASE_SHA"
          --run-id "$GITHUB_RUN_ID"
          --artifact-dir desktop/release/sparkle-publish
          --output release-evidence/macos.json

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          if-no-files-found: error
          path: desktop/release/sparkle-publish/*

      - name: Upload macOS candidate evidence
        uses: actions/upload-artifact@v7
        with:
          name: macos-evidence
          if-no-files-found: error
          path: release-evidence/macos.json

  certify:
    if: github.event_name == 'push' || inputs.candidate_run_id == ''
    runs-on: ubuntu-latest
    needs:
      - cli-gate
      - build-windows
      - build-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download Windows artifacts and evidence
        uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          path: release-inputs

      - name: Download macOS artifacts and evidence
        uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          path: release-inputs

      - name: Package mentor crawler Skill
        run: >-
          python scripts/packaging/package_crawl_mentors_skill.py
          --version "$RELEASE_TAG"
          --output-dir release-inputs/skill-release

      - name: Record Skill candidate evidence
        run: >-
          node scripts/release/release-candidate.mjs platform
          --platform skill
          --release-tag "$RELEASE_TAG"
          --release-sha "$RELEASE_SHA"
          --run-id "$GITHUB_RUN_ID"
          --artifact-dir release-inputs/skill-release
          --output release-inputs/skill-evidence/skill.json

      - name: Create candidate certification report
        run: >-
          node scripts/release/release-candidate.mjs candidate
          --repository "$GITHUB_REPOSITORY"
          --release-tag "$RELEASE_TAG"
          --release-sha "$RELEASE_SHA"
          --run-id "$GITHUB_RUN_ID"
          --release-notes desktop/release-notes.md
          --windows-dir release-inputs/windows-release
          --windows-evidence release-inputs/windows-evidence/windows.json
          --macos-dir release-inputs/macos-release
          --macos-evidence release-inputs/macos-evidence/macos.json
          --skill-dir release-inputs/skill-release
          --skill-evidence release-inputs/skill-evidence/skill.json
          --output release-inputs/release-candidate/release-candidate.json

      - name: Upload Skill candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: skill-release
          if-no-files-found: error
          path: release-inputs/skill-release/*

      - name: Upload candidate certification report
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          if-no-files-found: error
          path: release-inputs/release-candidate/release-candidate.json

  publish:
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.certify.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.candidate_run_id != ''))
    runs-on: ubuntu-latest
    needs:
      - preflight
      - cli-gate
      - build-windows
      - build-macos
      - certify
    env:
      CANDIDATE_RUN_ID: ${{ github.event_name == 'push' && github.run_id || inputs.candidate_run_id }}

    steps:
      - name: Checkout promotion tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate certified candidate workflow run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          test "$(jq -r .path <<<"$candidate")" = ".github/workflows/release.yml"
          test "$(jq -r .event <<<"$candidate")" = "workflow_dispatch"
          test "$(jq -r .status <<<"$candidate")" = "completed"
          test "$(jq -r .conclusion <<<"$candidate")" = "success"
          test "$(jq -r .head_sha <<<"$candidate")" = "$RELEASE_SHA"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: release-assets/windows
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-release
          path: release-assets/macos
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Skill artifact
        uses: actions/download-artifact@v8
        with:
          name: skill-release
          path: release-assets/skill
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download candidate certification report
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: release-assets/candidate
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify certified candidate report and artifact digests
        run: >-
          node scripts/release/release-candidate.mjs verify
          --manifest release-assets/candidate/release-candidate.json
          --repository "$GITHUB_REPOSITORY"
          --release-tag "$RELEASE_TAG"
          --release-sha "$RELEASE_SHA"
          --run-id "$CANDIDATE_RUN_ID"
          --release-notes desktop/release-notes.md
          --windows-dir release-assets/windows
          --macos-dir release-assets/macos
          --skill-dir release-assets/skill

      - name: Validate staged release artifacts
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          required_assets=(
            "release-assets/windows/AutoEmailSender-Setup-$version.exe"
            "release-assets/windows/AutoEmailSender-Setup-$version.exe.blockmap"
            "release-assets/windows/latest.yml"
            "release-assets/macos/AutoEmailSender-$version-arm64.dmg"
            "release-assets/macos/appcast.xml"
            "release-assets/skill/crawl-mentors-to-xlsx-v$version.zip"
          )
          for asset in "${required_assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "Missing required release artifact: $asset" >&2
              exit 1
            fi
          done

      - name: Create deferred release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git cat-file -e "$RELEASE_SHA^{commit}"
          remote_target="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          if [[ -n "$remote_target" && "$remote_target" != "$RELEASE_SHA" ]]; then
            echo "Refusing to move existing tag $RELEASE_TAG from $remote_target to $RELEASE_SHA." >&2
            exit 1
          fi
          if [[ -z "$remote_target" ]]; then
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to replace assets on published Release $RELEASE_TAG; publish a new version instead." >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --notes-file ./desktop/release-notes.md
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --notes-file ./desktop/release-notes.md
          fi

      - name: Upload installers and update metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s nullglob
          skill_assets=(release-assets/skill/*.zip)
          if ((${#skill_assets[@]} != 1)); then
            echo "Expected exactly one mentor crawler Skill ZIP, found ${#skill_assets[@]}." >&2
            exit 1
          fi
          assets=(release-assets/windows/* release-assets/macos/*.dmg release-assets/macos/*.delta "${skill_assets[@]}")
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release upload "$RELEASE_TAG" release-assets/macos/appcast.xml --clobber

      - name: Verify draft Sparkle asset URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: >-
          node scripts/release/verify-sparkle-draft-assets.mjs
          --repository "$GITHUB_REPOSITORY"
          --release-tag "$RELEASE_TAG"
          --appcast release-assets/macos/appcast.xml

      - name: Publish staged GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
