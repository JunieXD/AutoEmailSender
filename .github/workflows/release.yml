name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Check time usage
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check-time-usage.ps1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --dev

      - name: Build backend executable
        run: ./scripts/build-backend.ps1 -Clean
        shell: pwsh

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows release
        working-directory: desktop
        run: npm run dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            desktop/release/AutoEmailSender-Setup-*.exe
            desktop/release/AutoEmailSender-Setup-*.exe.blockmap
            desktop/release/latest.yml

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --dev

      - name: Build backend executable
        run: ./scripts/build-backend.sh --clean

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Test Sparkle release helpers
        run: >-
          node --test
          scripts/configure-sparkle-info.test.mjs
          scripts/sanitize-macos-bundle.test.mjs
          scripts/prepare-sparkle-release.test.mjs

      - name: Test desktop
        working-directory: desktop
        run: npm test

      - name: Build macOS DMG
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: npm run dist:mac

      - name: Generate signed appcast and deltas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: >-
          node scripts/prepare-sparkle-release.mjs
          --release-tag "${{ github.ref_name }}"
          --output-dir desktop/release/sparkle-publish

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: desktop/release/sparkle-publish/*

  publish:
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-assets/macos

      - name: Package mentor crawler Skill
        run: >-
          python scripts/package_crawl_mentors_skill.py
          --version "${{ github.ref_name }}"
          --output-dir release-assets/skill

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${{ github.ref_name }}" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to replace assets on published Release ${{ github.ref_name }}; publish a new version instead." >&2
              exit 1
            fi
            gh release edit "${{ github.ref_name }}" --notes-file ./desktop/release-notes.md
          else
            gh release create "${{ github.ref_name }}" --draft --verify-tag --title "${{ github.ref_name }}" --notes-file ./desktop/release-notes.md
          fi

      - name: Upload installers and update metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s nullglob
          skill_assets=(release-assets/skill/*.zip)
          if ((${#skill_assets[@]} != 1)); then
            echo "Expected exactly one mentor crawler Skill ZIP, found ${#skill_assets[@]}." >&2
            exit 1
          fi
          assets=(release-assets/windows/* release-assets/macos/*.dmg release-assets/macos/*.delta "${skill_assets[@]}")
          gh release upload "${{ github.ref_name }}" "${assets[@]}" --clobber
          gh release upload "${{ github.ref_name }}" release-assets/macos/appcast.xml --clobber

      - name: Publish staged GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "$(gh release view "${{ github.ref_name }}" --json isDraft --jq .isDraft)" == "true" ]]; then
            gh release edit "${{ github.ref_name }}" --draft=false --latest
          fi
