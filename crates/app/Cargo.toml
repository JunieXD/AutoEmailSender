[package]
name = "auto-email-sender"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
matching.workspace = true
api.workspace = true
profile.workspace = true
receive.workspace = true
send.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tempfile = "3"
tracing.workspace = true
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
task.workspace = true
crawl.workspace = true
tauri-plugin-autostart = "2"
tokio = { workspace = true, features = ["sync"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.6"

[build-dependencies]
tauri-build = { version = "2", features = [] }
