[package]
name = "mailbox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cloud-api.workspace = true
lettre = { version = "0.11", default-features = false }
net.workspace = true
serde.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
transport = { workspace = true, features = ["sqlx", "ts-rs"] }
ts-rs.workspace = true

[dev-dependencies]
db = { workspace = true, features = ["testing"] }
fakemail.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
