[package]
name = "mailbox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
futures-util = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
rustls-platform-verifier = "0.7"
serde.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["net", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-socks = "0.5"
tracing.workspace = true
ts-rs.workspace = true
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.7"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
base64 = "0.22"
db.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
time = "0.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
