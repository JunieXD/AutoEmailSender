[package]
name = "mailbox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
futures-util = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
net.workspace = true
serde.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-socks = "0.5"
tracing.workspace = true
ts-rs.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
db.workspace = true
fakemail.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
