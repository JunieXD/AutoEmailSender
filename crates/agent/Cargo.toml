[package]
name = "agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "autoemail"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.7.0", default-features = false, features = ["server", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
test-fixtures = { path = "../test-fixtures" }
api.workspace = true
profile.workspace = true
sqlx.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["process", "test-util"] }
