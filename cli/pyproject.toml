[project]
name = "auto-email-sender-cli"
version = "2.6.0b1"
description = "Agent-friendly command line interface for Auto Email Sender"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<1",
    # Parser error handling and generic invocation currently use Typer's
    # vendored Click compatibility layer; keep that private surface pinned.
    "typer>=0.27,<0.28",
]

[project.scripts]
auto-email-sender = "auto_email_sender_cli.main:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_email_sender_cli"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
]
