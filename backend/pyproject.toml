[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "beautifulsoup4>=4.14.3",
    "defusedxml>=0.7.1",
    "fastapi>=0.135.1",
    "httpx[socks]>=0.28.1",
    "lxml>=5.4.0",
    "mammoth>=1.12.0",
    "markdownify>=1.2.2",
    "openai>=2.30.0,<3",
    "openpyxl>=3.1.5",
    "pdfminer-six>=20251230",
    "pdfplumber>=0.11.9",
    "playwright>=1.58.0",
    "pydantic>=2.12.5",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.26",
    "pypdf>=6.10.2",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.42.0",
    "tldextract>=5.3.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Start with correctness rules; enable broader style rules incrementally.
select = ["E9", "F601", "F821"]
